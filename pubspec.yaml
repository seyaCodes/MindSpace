name: mind_space
description: A quiet place for what's loud.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.0
  go_router: ^13.0.0
  flutter_dotenv: ^5.0.0
  shared_preferences: ^2.0.0
  google_fonts: ^6.0.0
  app_links: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/pink.png
    - assets/blue.png
    - assets/green.png
    - assets/teal.png
    - assets/orange.png
    - assets/purple.png